# Builds the plugin (x64 + x86), runs the tests, and publishes a release with
# the installable blitzmd.zip when a version tag (v1.2.3) is pushed.
name: CI

on:
  push:
    branches: [master]    # (other branches: through their pull requests, not twice)
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version in CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}    # (as a variable: never pasted into the script)
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(blitzmd VERSION ([0-9.]+)') { throw 'No version in CMakeLists.txt' }
          if ("v$($matches[1])" -ne $env:TAG) {
            throw "Tag $env:TAG does not match version $($matches[1]) in CMakeLists.txt"
          }

      - name: Build x64 and x86, package dist/blitzmd.zip
        shell: powershell
        run: .\scripts\build.ps1 -Arch all -Package

      - name: Test (x64)
        shell: powershell
        run: .\scripts\test.ps1 -Build out/build/x64-release

      - name: Test (x86)
        shell: powershell
        run: .\scripts\test.ps1 -Build out/build/x86-release -Quick

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: blitzmd
          path: dist/blitzmd.zip
          if-no-files-found: error

  # The uploaded package, downloaded the way the release job gets it, has what
  # Total Commander's auto-installer needs.
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blitzmd

      - name: Check the package contents
        shell: python
        run: |
          import sys, zipfile
          z = zipfile.ZipFile("blitzmd.zip")
          for info in z.infolist():
              print(f"{info.file_size:>10}  {info.filename}")
          missing = {"blitzmd.wlx", "blitzmd.wlx64", "pluginst.inf", "README.md", "LICENSE"} - set(z.namelist())
          if missing:
              sys.exit(f"::error::blitzmd.zip lacks {', '.join(sorted(missing))}")
          if not z.read("pluginst.inf").startswith(b"[plugininstall]\r\n"):
              sys.exit("::error::pluginst.inf must start with [plugininstall] and use CRLF line endings")

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blitzmd

      # Short notes about the program (not the list of every PR) and the SHA-256
      # of the attached zip, since the plugin isn't code-signed. What's new in a
      # version is added by hand: gh release edit.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(sha256sum blitzmd.zip | cut -d' ' -f1)
          cat > notes.md <<EOF
          **BlitzMD** is a lightweight Markdown viewer plugin (Lister, WLX) for Total Commander, x64 and x86. It shows Markdown files according to GitHub Flavored Markdown, drawing them with Direct2D and DirectWrite without a browser engine. Supported: tables, task lists, footnotes, alerts, math, Mermaid diagrams, syntax-highlighted code, emoji, dark mode.

          **Install:** open \`blitzmd.zip\` in Total Commander and confirm the installation.

          **BlitzMD** — легковесный плагин просмотра Markdown (Lister, WLX) для Total Commander, x64 и x86. Показывает Markdown файлы по стандарту GitHub Flavored Markdown, рисуя их при помощи Direct2D и DirectWrite без браузерного движка. Поддерживаются таблицы, списки задач, сноски, алерты, формулы, диаграммы Mermaid, подсветка кода, эмодзи, тёмная тема.

          **Установка:** откройте \`blitzmd.zip\` в Total Commander и подтвердите установку.

          SHA-256 (\`blitzmd.zip\`): \`$sha\`
          EOF
          gh release create "$TAG" blitzmd.zip --repo "$REPO" --title "BlitzMD $TAG" --notes-file notes.md
