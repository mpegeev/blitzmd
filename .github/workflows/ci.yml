# Builds the plugin (x64 + x86), runs the tests, and publishes a release with
# the installable mdview.zip when a version tag (v1.2.3) is pushed.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(mdview-wlx VERSION ([0-9.]+)') { throw 'No version in CMakeLists.txt' }
          if ("v$($matches[1])" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match version $($matches[1]) in CMakeLists.txt"
          }

      - name: Build x64 and x86, package dist/mdview.zip
        shell: powershell
        run: .\scripts\build.ps1 -Arch all -Package

      - name: Test (x64)
        shell: powershell
        run: .\scripts\test.ps1 -Build out/build/x64-release

      - name: Test (x86)
        shell: powershell
        run: .\scripts\test.ps1 -Build out/build/x86-release -Quick

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: mdview
          path: dist/mdview.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdview

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" mdview.zip
          --repo "${{ github.repository }}"
          --title "mdview ${{ github.ref_name }}"
          --generate-notes
