<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="80" height="20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="80" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="49" height="20" fill="#555"/>
    <rect x="49" width="31" height="20" fill="#1f883d"/>
    <rect width="80" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)">license</text>
    <text x="245" y="140" transform="scale(.1)" fill="#fff">license</text>
    <text aria-hidden="true" x="645" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)">MIT</text>
    <text x="645" y="140" transform="scale(.1)" fill="#fff">MIT</text>
  </g>
</svg>
